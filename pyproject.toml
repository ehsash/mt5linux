[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5linux"
version = "0.2.0"
description = "MetaTrader5 for linux users"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Lucas Prett Campagna"}
]
urls = {Homepage = "https://github.com/lucas-campagna/mt5linux"}
dependencies = [
    "numpy",
    "plumbum==1.7.0",
    "pyparsing==2.4.7",
    "rpyc==5.2.3",
    "typer",
]

[project.scripts]
mt5linux = "mt5linux.cli:app"

[tool.setuptools]
packages = ["mt5linux"]

[tool.hatch.build.targets.wheel]
packages = ["mt5linux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
